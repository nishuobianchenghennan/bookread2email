# .github/workflows/daily_reading.yml (V4.2 - 权限和参数修正版)

name: 每日阅读分析自动化任务

on:
  push:
    branches:
      - gh-pages
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  run-reading-analysis:
    runs-on: ubuntu-latest

    # 【修正 1】为整个 Job 授予写入权限
    permissions:
      contents: write # 允许 actions 对仓库内容进行写操作 (commit, push)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install zhipuai openai google-generativeai anthropic PyMuPDF ebooklib beautifulsoup4

      - name: Run main script
        env:
          # ... (你的 Secrets 保持不变)
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_AUTH_CODE: ${{ secrets.SENDER_AUTH_CODE }}
          RECEIVER_EMAILS: ${{ secrets.RECEIVER_EMAILS }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_BASE_URL: ${{ secrets.CLAUDE_BASE_URL }}
          MODEL_ZHIPU: ${{ secrets.MODEL_ZHIPU }}
          MODEL_OPENAI: ${{ secrets.MODEL_OPENAI }}
          MODEL_GEMINI: ${{ secrets.MODEL_GEMINI }}
          MODEL_CLAUDE: ${{ secrets.MODEL_CLAUDE }}
        run: python main.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # 【修正 2】将 'commit_branch' 修改为正确的参数 'branch'
          branch: gh-pages
          
          commit_message: "chore: 自动更新阅读进度"
          commit_user_name: "Yixing Gu"
          commit_user_email: "77688784@qq.com"
          file_pattern: "*.json"
