# .github/workflows/daily_reading.yml

name: 每日阅读分析自动化任务

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-reading-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install zhipuai openai google-generativeai anthropic PyMuPDF ebooklib beautifulsoup4

      - name: Run main script
        env:
          # --- 基础配置 Secrets ---
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_AUTH_CODE: ${{ secrets.SENDER_AUTH_CODE }}
          RECEIVER_EMAILS: ${{ secrets.RECEIVER_EMAILS }}

          # --- API 密钥 Secrets ---
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          
          # --- 【核心修改 1】URL Secrets ---
          ZHIPU_BASE_URL: ${{ secrets.ZHIPU_BASE_URL }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          CLAUDE_BASE_URL: ${{ secrets.CLAUDE_BASE_URL }}

          # --- 【核心修改 2】模型名称 Secrets ---
          MODEL_ZHIPU: ${{ secrets.MODEL_ZHIPU }}
          MODEL_OPENAI: ${{ secrets.MODEL_OPENAI }}
          MODEL_GEMINI: ${{ secrets.MODEL_GEMINI }}
          MODEL_CLAUDE: ${{ secrets.MODEL_CLAUDE }}

        run: python main.py
