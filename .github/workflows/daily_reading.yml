# .github/workflows/daily_reading.yml (V4.1 - 增加手动触发)

name: 每日阅读分析自动化任务

on:
  # 1. 当代码被推送到 gh-pages 分支时触发
  push:
    branches:
      - gh-pages
      
  # 2. 【核心修改】允许手动触发 (用于测试)
  workflow_dispatch:

  # 3. 定时触发
  schedule:
    # 北京时间每天上午8点 (UTC时间凌晨0点)
    - cron: '0 0 * * *'

jobs:
  run-reading-analysis:
    runs-on: ubuntu-latest
    
    steps:
      # 第一步：检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      # 第二步：设置Python环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 第三步：安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install zhipuai openai google-generativeai anthropic PyMuPDF ebooklib beautifulsoup4

      # 第四步：运行主脚本
      - name: Run main script
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_AUTH_CODE: ${{ secrets.SENDER_AUTH_CODE }}
          RECEIVER_EMAILS: ${{ secrets.RECEIVER_EMAILS }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          GEMINI_API_KEYS: ${{ secrets.GEMINI_API_KEYS }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_BASE_URL: ${{ secrets.CLAUDE_BASE_URL }}
          MODEL_ZHIPU: ${{ secrets.MODEL_ZHIPU }}
          MODEL_OPENAI: ${{ secrets.MODEL_OPENAI }}
          MODEL_GEMINI: ${{ secrets.MODEL_GEMINI }}
          MODEL_CLAUDE: ${{ secrets.MODEL_CLAUDE }}
        run: python main.py

      # 第五步：自动提交文件变更
      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_branch: gh-pages
          commit_message: "chore: 自动更新阅读进度"
          commit_user_name: "Yixing Gu"
          commit_user_email: "77688784@qq.com"
          file_pattern: "*.json"
